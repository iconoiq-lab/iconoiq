<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme before first paint: the saved choice (light by default) sets the
         class and colour-scheme so dark visitors never see a light frame.
         Same key and logic as src/contexts/ThemeContext.tsx. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('iconoiq-theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') theme = stored;
        } catch (e) {}
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.add(dark ? 'dark' : 'light');
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C0A09" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Keep in sync with BRAND in src/config/brand.ts. -->
    <title>ICONOIQ</title>
    <meta name="description" content="ICONOIQ: Indian iconography learning kits inspired by Shilpa Shastra and temple heritage, for children, schools, academies and temples." />
    <meta name="author" content="ICONOIQ" />

    <meta property="og:title" content="ICONOIQ" />
    <meta property="og:description" content="ICONOIQ: Indian iconography learning kits inspired by Shilpa Shastra and temple heritage, for children, schools, academies and temples." />
    <meta property="og:type" content="website" />
    <!-- Absolute, from VITE_SITE_URL (set it on Vercel; see .env.example). -->
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces (headings) + Inter (body). Keep in sync with --font-heading / --font-body in src/index.css. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400..700&display=swap" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
